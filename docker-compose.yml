
services:
  registry-discovery:
    container_name: id-eureka
    image: eurekaserver_image:latest
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M"

  product-catalog:
    container_name: bd-product-catalog
    image: product_image:latest
    ports:
      - "8083:8083"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M -DEUREKA_SERVER=http://registry-discovery:8761/eureka/"
    depends_on:
      - registry-discovery

  customer:
    container_name: bd-customer
    image: customer_image:latest
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M -DEUREKA_SERVER=http://registry-discovery:8761/eureka/"
    depends_on:
      - registry-discovery

  transactions:
    container_name: bd-transactions
    image: transactions_image:latest
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M -DEUREKA_SERVER=http://registry-discovery:8761/eureka/"
    depends_on:
      - registry-discovery

  configserver:
    container_name: id-configserver
    image: configserver_image:latest
    ports:
      - "8888:8888"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M"

  springbootadmin:
    container_name: id-springbootadmin
    image: springbootadmin_image:latest
    ports:
      - "8762:8762"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M"

  postgres_db:
    container_name: postgres
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - ./dbfiles:/docker-entrypoint-initdb.d
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: postgres

  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "qwerty"
    ports:
      - "80:80"  
    depends_on:
      - postgres_db