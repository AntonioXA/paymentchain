#Se pueden eliminar estas variables e inicializarlas al lanzar el jar. Asi se podran cambiar el valor de
#estas variables de configuracion sin tener que volver a compilar
#Ejemplo: java -jar -Dspring.cloud.config.name=config-client -Dspring.cloud.config.profile=local /path_jar

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.port=8081
custom.activeprofileName=local

#spring.jpa.show-sql=true
#spring.datasource.url=jdbc:h2:mem:customer
#spring.datasource.username=sa
#spring.datasource.password=qwerty
#spring.datasource.driver-class-name=org.h2.Driver
#spring.h2.console.enabled=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://postgres_db:5432/customer
spring.datasource.username=postgres
spring.datasource.password=qwerty

spring.application.name=businessdomain-customer
eureka.client.serviceUrl.default=http:localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true

spring.cloud.config.enabled=false

management.endpoints.web.exposure.include=*
#server.servlet.context-path=/business/v1

springdoc.packagesToScan=com.paymentchain.customer.entities, com.paymentchain.customer.controller, com.paymentchain.customer.controller
springdoc.pathsToMatch=/v1, /customer/**